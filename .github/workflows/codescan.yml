# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow requires that you have an existing account with codescan.io
# For more information about configuring your workflow,
# read our documentation at https://github.com/codescan-io/codescan-scanner-action
name: CodeScan

on:
  push:
    branches: [ "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master" ]
  schedule:
    - cron: '25 19 * * 4'

permissions:
  contents: read

jobs:
  CodeScan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The CodeScan action is a Node action and its embedded scanner may not
      # inherit the Java selection reliably. Export the resolved Java 17 path
      # explicitly so the scanner cannot fall back to Java 11.
      - name: Force CodeScan to use Java 17
        shell: bash
        run: |
          set -euo pipefail

          JAVA17_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"

          echo "JAVA_HOME=${JAVA17_HOME}" >> "${GITHUB_ENV}"
          echo "${JAVA17_HOME}/bin" >> "${GITHUB_PATH}"

          echo "Using Java at: ${JAVA17_HOME}"
          "${JAVA17_HOME}/bin/java" -version

      - name: Cache files
        uses: actions/cache@v4
        with:
          path: ~/.sonar
          key: ${{ runner.os }}-sonar-java17-v2
          restore-keys: |
            ${{ runner.os }}-sonar-java17-
            ${{ runner.os }}-sonar-

      - name: Run Analysis
        uses: codescan-io/codescan-scanner-action@5b2e8c5683ef6a5adc8fa3b7950bb07debccce12
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          PATH: ${{ env.JAVA_HOME }}/bin:${{ env.PATH }}
        with:
          login: ${{ secrets.CODESCAN_AUTH_TOKEN }}
          organization: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
          projectKey: ${{ secrets.CODESCAN_PROJECT_KEY }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codescan.sarif
