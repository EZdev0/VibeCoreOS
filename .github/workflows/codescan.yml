# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CodeScan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "25 19 * * 4"

permissions:
  contents: read

jobs:
  CodeScan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Export Java 17 without replacing PATH
        shell: bash
        run: |
          set -euo pipefail

          test -n "${JAVA_HOME_17_X64:-}"
          test -x "${JAVA_HOME_17_X64}/bin/java"

          # setup-java's Java 17 installation is made available to all
          # subsequent steps. GITHUB_PATH prepends only this directory and
          # preserves the runner's standard tools such as dirname and basename.
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME_17_X64}/bin" >> "${GITHUB_PATH}"

          echo "JAVA_HOME=${JAVA_HOME_17_X64}"
          echo "PATH=${JAVA_HOME_17_X64}/bin:${PATH}"
          command -v java
          command -v dirname
          command -v basename
          java -version

      - name: Verify Java 17 in a new step
        shell: bash
        run: |
          set -euo pipefail

          test "$(java -version 2>&1 | awk -F'[\".]' '/version/ {print $2}')" = "17"
          test "$(command -v dirname)" != ""
          test "$(command -v basename)" != ""
          java -version

      - name: Cache SonarScanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar
          key: ${{ runner.os }}-sonar-java17-v5
          restore-keys: |
            ${{ runner.os }}-sonar-java17-

      - name: Run Analysis
        uses: codescan-io/codescan-scanner-action@5b2e8c5683ef6a5adc8fa3b7950bb07debccce12
        with:
          login: ${{ secrets.CODESCAN_AUTH_TOKEN }}
          organization: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
          projectKey: ${{ secrets.CODESCAN_PROJECT_KEY }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codescan.sarif
