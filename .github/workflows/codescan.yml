# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CodeScan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "25 19 * * 4"

permissions:
  contents: read

jobs:
  CodeScan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-java exposes the selected installation as JAVA_HOME_17_X64.
      # Use that variable directly instead of resolving `java` from PATH,
      # because the runner may still resolve the preinstalled Java 11 first.
      - name: Select Java 17 explicitly
        shell: bash
        run: |
          set -euo pipefail

          test -n "${JAVA_HOME_17_X64:-}"
          test -x "${JAVA_HOME_17_X64}/bin/java"

          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME_17_X64}/bin" >> "${GITHUB_PATH}"

          echo "Selected Java: ${JAVA_HOME_17_X64}"
          "${JAVA_HOME_17_X64}/bin/java" -version

      - name: Verify Java used by the next step
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          set -euo pipefail
          export PATH="${JAVA_HOME}/bin:${PATH}"
          test "$(java -version 2>&1 | awk -F'[\".]' '/version/ {print $2}')" = "17"
          command -v java
          java -version

      - name: Cache SonarScanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar
          key: ${{ runner.os }}-sonar-java17-v4
          restore-keys: |
            ${{ runner.os }}-sonar-java17-

      - name: Run Analysis
        uses: codescan-io/codescan-scanner-action@5b2e8c5683ef6a5adc8fa3b7950bb07debccce12
        env:
          # This is the critical fix. Do not rely on the generic JAVA_HOME
          # or the runner PATH; pass setup-java's Java 17 installation to the
          # Node action explicitly.
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          PATH: ${{ env.JAVA_HOME_17_X64 }}/bin:${{ env.PATH }}
        with:
          login: ${{ secrets.CODESCAN_AUTH_TOKEN }}
          organization: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
          projectKey: ${{ secrets.CODESCAN_PROJECT_KEY }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codescan.sarif
