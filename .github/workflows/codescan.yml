# documentation.

name: CodeScan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "25 19 * * 4"

permissions:
  contents: read

jobs:
  CodeScan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache CodeScan scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar
          key: ${{ runner.os }}-codescan-scanner-v2
          restore-keys: |
            ${{ runner.os }}-codescan-scanner-

      - name: Run CodeScan analysis
        uses: codescan-io/codescan-scanner-action@master
        with:
          login: ${{ secrets.CODESCAN_AUTH_TOKEN }}
          organization: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
          projectKey: ${{ secrets.CODESCAN_PROJECT_KEY }}
          generateReportFile: true
          generateSarifFile: false

      - name: Upload SARIF file
        if: always() && hashFiles('codescan.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codescan.sarif
